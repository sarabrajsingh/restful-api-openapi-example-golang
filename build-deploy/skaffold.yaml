apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: app1-delivery-pipeline
customActions:
- name: terraform-render
  containers:
  - name: terraform-render-container
    image: google/cloud-sdk:alpine
    command: ["/bin/sh"]
    args:
    - "-c"
    - |
      set -e
      
      mkdir -p /workspace/src
      gsutil cp "$CLOUD_DEPLOY_INPUT_GCS_PATH" /workspace/source.tgz
      tar -xzvf /workspace/source.tgz -C /workspace/src
      
      cd /workspace/src/
      PREV_ID=$(echo "p-${CLOUD_DEPLOY_RELEASE}-${environment}" | cut -c 1-39)
      
      gcloud infra-manager previews create ${PREV_ID} \
        --local-source="./terraform" \
        --project="${project_id}" \
        --location="us-east1" \
        --service-account="projects/${project_id}/serviceAccounts/${pipeline_sa}@${project_id}.iam.gserviceaccount.com" \
        --input-values=project_id="${project_id}",environment="${environment}" \
        --deployment="projects/${project_id}/locations/us-east1/deployments/app1-${environment}"
        
      gcloud infra-manager previews export projects/${project_id}/locations/us-east1/previews/${PREV_ID} \
        --file=/workspace/src/preview-export.tgz
        
      mkdir -p /workspace/src/preview-results/
      tar -xzvf /workspace/src/preview-export.tgz -C /workspace/src/preview-results/
      
      echo "Infrastructure Delta Plan for ${environment}:" > /workspace/src/manifest.yaml
      cat /workspace/src/preview-results/terraform-plan.json >> /workspace/src/manifest.yaml
      
      gsutil cp /workspace/src/manifest.yaml "$CLOUD_DEPLOY_OUTPUT_GCS_PATH/manifest.yaml"
      echo "{\"resultStatus\": \"SUCCEEDED\", \"manifestFile\": \"$CLOUD_DEPLOY_OUTPUT_GCS_PATH/manifest.yaml\"}" > results.json
      gsutil cp results.json "$CLOUD_DEPLOY_OUTPUT_GCS_PATH/results.json"
- name: terraform-deploy
  containers:
  - name: terraform-deploy-container
    image: google/cloud-sdk:alpine
    command: ["/bin/sh"]
    args:
    - "-c"
    - |
      set -e
      
      cd /workspace/src/
      DEP_ID="app1-${environment}"
      gcloud infra-manager deployments apply ${DEP_ID} \
        --local-source="./terraform" \
        --project="${project_id}" \
        --location="us-east1" \
        --service-account="projects/${project_id}/serviceAccounts/${pipeline_sa}@${project_id}.iam.gserviceaccount.com" \
        --input-values=project_id="${project_id}",environment="${environment}" \
        --import-existing-resources
        
      echo "{\"resultStatus\": \"SUCCEEDED\"}" > results.json
      gsutil cp results.json "$CLOUD_DEPLOY_OUTPUT_GCS_PATH/results.json"
