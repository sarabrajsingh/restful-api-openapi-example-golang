steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:alpine'
    id: 'infra-manager-preview-dev'
    env:
      - 'SHORT_SHA=${_SHORT_SHA}'
    script: |
      #!/bin/sh
      set -e
      
      echo "📦 Packaging Terraform blueprint..."
      cd terraform
      apk add --no-cache zip
      zip -r /tmp/blueprint.zip .
      
      echo "📤 Uploading packaged zip to GCS..."
      gcloud storage cp /tmp/blueprint.zip gs://app1-cicd-8c0e2f7a-tfstate/previews/source-pr-${SHORT_SHA}-dev.zip
      
      echo "🔍 Creating dry-run Infrastructure Manager Preview for DEV..."
      # Truncate Preview ID to be safely below 40 characters:
      PREV_ID=$(echo "p-pr-${SHORT_SHA}-dev" | cut -c 1-39)
      
      gcloud infra-manager previews create ${PREV_ID} \
        --gcs-source="gs://app1-cicd-8c0e2f7a-tfstate/previews/source-pr-${SHORT_SHA}-dev.zip" \
        --project="app1-dev-8c0e2f7a" \
        --location="us-east1" \
        --service-account="projects/app1-dev-8c0e2f7a/serviceAccounts/dev-pipeline-sa@app1-dev-8c0e2f7a.iam.gserviceaccount.com" \
        --input-values=project_id="app1-dev-8c0e2f7a",environment="dev" \
        --impersonate-service-account="dev-pipeline-sa@app1-dev-8c0e2f7a.iam.gserviceaccount.com"

options:
  logging: CLOUD_LOGGING_ONLY